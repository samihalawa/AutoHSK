<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK Exercise Generator - Enhanced with Flowbite</title>
  <!-- Tailwind CSS & Flowbite -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.2.7/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/flowbite@1.6.3/dist/flowbite.min.js"></script>

  <!-- Mocha for TDD -->
  <link rel="stylesheet" href="https://unpkg.com/mocha/mocha.css" />
  <script src="https://unpkg.com/mocha/mocha.js"></script>
  <script src="https://unpkg.com/chai/chai.js"></script>

  <style>
    #mocha {
      margin-top: 40px;
    }
    /* Additional styling for the main page layout */
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
    }
    #main-container {
      max-width: 800px;
      margin: 20px auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    #lessonContent {
      min-height: 150px;
    }
  </style>
</head>
<body class="text-gray-800">
  <div id="main-container">
    <h1 class="text-2xl font-bold text-center mb-4">HSK Exercise Generator</h1>
    <p class="text-center mb-6">Paste the lesson content and generate structured exercises in HTML format.</p>

    <div class="mb-4">
      <label for="lessonContent" class="block font-medium mb-2">Lesson Content:</label>
      <textarea id="lessonContent" class="block w-full border border-gray-300 rounded-lg p-2" placeholder="Paste the lesson content here..."></textarea>
    </div>

    <div class="flex flex-wrap justify-center gap-4">
      <button id="generateBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded">Generate Exercises</button>
      <button id="downloadPdf" class="hidden bg-green-600 hover:bg-green-700 text-white font-semibold px-4 py-2 rounded">Download as PDF</button>
      <button id="copyText" class="hidden bg-gray-600 hover:bg-gray-700 text-white font-semibold px-4 py-2 rounded">Copy Text</button>
    </div>

    <div id="loading" class="text-center mt-6 hidden">
      <div role="status">
        <svg aria-hidden="true" class="inline w-8 h-8 mr-2 text-gray-200 animate-spin fill-blue-600" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M100 50.5908C100 78.2054 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2054 0 50.5908C0 22.9762 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9762 100 50.5908Z" fill="currentColor"/>
          <path d="M93.9676 39.0409C96.393 38.4038 98.0084 36.2308 97.3418 33.8402C96.4052 30.2101 94.9107 26.8045 92.8614 23.7762C90.812 20.748 88.246 18.174 85.2154 16.1275C82.1848 14.081 78.74 12.6034 75.1003 11.7785C71.4607 10.9535 67.6902 10.8024 63.9927 11.3334C60.2952 11.8643 56.7423 13.0643 53.553 14.8779C50.3636 16.6914 47.6071 19.08 45.4022 21.8794C43.1972 24.6789 41.5912 27.8274 40.6545 31.1557C39.7179 34.484 39.4694 37.9382 39.9253 41.3469C40.3812 44.7557 41.5333 48.0582 43.3133 51.051C45.0932 54.0437 47.4687 56.6679 50.2961 58.7671C53.1235 60.8664 56.3427 62.3982 59.7678 63.2836C63.1929 64.169 66.7599 64.3945 70.2334 63.9445C73.7069 63.4944 77.0078 62.3772 79.9815 60.6474C82.9552 58.9177 85.5303 56.6026 87.5576 53.845C89.5849 51.0873 91.0309 47.9385 91.8401 44.5768C92.6494 41.2152 92.804 37.6983 92.2941 34.275C91.7839 30.8517 90.6199 27.6009 88.8775 24.7036" fill="currentFill"/>
        </svg>
        <span class="text-gray-700">Processing... Please wait.</span>
      </div>
    </div>

    <div id="output" class="mt-6 hidden border border-gray-200 rounded p-4 bg-gray-50 text-left"></div>
  </div>

  <!-- Mocha Test Section -->
  <div id="mocha" class="max-w-4xl mx-auto"></div>

  <script>
    // Enable mocha
    mocha.setup("bdd");
    const expect = chai.expect;

    // The main function that fetches AI-generated exercises
    async function generateExercisesAPI(lessonText) {
      const response = await fetch("https://api-inference.huggingface.co/models/meta-llama/Llama-3.2-11B-Vision-Instruct", {
        method: "POST",
        headers: {
          "Authorization": "Bearer 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",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          inputs: `Generate structured HSK exercises using this lesson content: ${lessonText}`,
          parameters: { max_new_tokens: 2000, temperature: 0.1 }
        })
      });
      const result = await response.json();
      return result.generated_text;
    }

    // Handler for the generate button
    async function generateExercises() {
      const lessonText = document.getElementById("lessonContent").value.trim();
      const loadingEl = document.getElementById("loading");
      const outputEl = document.getElementById("output");
      const downloadBtn = document.getElementById("downloadPdf");
      const copyBtn = document.getElementById("copyText");

      if (!lessonText) {
        alert("Please paste the lesson content first.");
        return;
      }

      loadingEl.classList.remove("hidden");
      outputEl.classList.add("hidden");
      downloadBtn.classList.add("hidden");
      copyBtn.classList.add("hidden");

      try {
        const data = await generateExercisesAPI(lessonText);
        loadingEl.classList.add("hidden");
        if (data) {
          outputEl.innerHTML = data;
          outputEl.classList.remove("hidden");
          downloadBtn.classList.remove("hidden");
          copyBtn.classList.remove("hidden");
        } else {
          outputEl.innerHTML = "Error: No content generated.";
          outputEl.classList.remove("hidden");
        }
      } catch (error) {
        loadingEl.classList.add("hidden");
        outputEl.innerHTML = "Error processing request.";
        outputEl.classList.remove("hidden");
        console.error(error);
      }
    }

    // Download the generated text as PDF (simple text-based approach)
    function downloadAsPDF() {
      const element = document.createElement("a");
      const blob = new Blob([document.getElementById("output").innerText], { type: "application/pdf" });
      element.href = URL.createObjectURL(blob);
      element.download = "hsk_exercises.pdf";
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
    }

    // Copy text to clipboard
    function copyToClipboard() {
      const text = document.getElementById("output").innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("Copied to clipboard!");
      }).catch(err => {
        alert("Failed to copy.");
        console.error(err);
      });
    }

    // DOMContentLoaded event
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("generateBtn").addEventListener("click", generateExercises);
      document.getElementById("downloadPdf").addEventListener("click", downloadAsPDF);
      document.getElementById("copyText").addEventListener("click", copyToClipboard);
    });

    // TDD Test Cases
    describe("HSK Exercise Generator", function() {
      it("should return a string when fetching from the API", async function() {
        // We can only do a minimal test, as we rely on an external API.
        // We'll do a mock test with a short string as an example.
        const mockLessonText = "Test Lesson Content";

        // In a real test, we might mock fetch(). But here, let's just check if the function returns a string.
        const result = await generateExercisesAPI(mockLessonText);
        expect(result).to.be.a("string");
      });
    });

    mocha.run();
  </script>
</body>
</html>
